<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Objects - Hector</h2>

<script>

    function Vehicle(name, maker) {
        this.name = name;
        this.maker = maker;
    }

    var car1 = new Vehicle('Focus', 'Ford'); // 'Focus', 'Ford'
    var car2 = new Vehicle('Elantra', 'Hyundai'); //'Elantra', 'Hyundai'

    document.write(car1.name); // Output: Focus
    document.write(car2.name); // Output: Elantra


</script>


</body>
</html>
