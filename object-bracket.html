<!doctype html>
<html>
  <body>
    <h2>JavaScript Objects - Hector</h2>

    <script>
      let school = {
        name: "WestCliff Bootcamp",
        displayInfo: function () {
          document.write(`${school.name.split(' ')[0]}`);
        },
      };
      school.displayInfo();
    </script>
  </body>
</html>
